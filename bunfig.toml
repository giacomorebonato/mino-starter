[serve.static]
plugins = ["bun-plugin-tailwind"]

[install]
# Required peers are declared explicitly; the Tailwind plugin’s Bun peer would
# otherwise install a second runtime that shadows the system Bun in scripts.
peer = false

# Bun's recommended JS/TS, React Hooks, and bun:test rules remain enabled.
# Generated files and build/test output are excluded by .gitignore.
[lint]

[lint.rules]
"eqeqeq" = "error"
"no-console" = "error"
"no-nested-ternary" = "error"
"no-param-reassign" = "error"
"no-useless-catch" = "error"
"prefer-const" = "error"
"require-yield" = "error"
"max-params" = ["warn", { max = 4 }]
"max-lines-per-function" = ["warn", { max = 50, skipBlankLines = true, skipComments = true }]
"@typescript-eslint/no-unused-vars" = ["error", { args = "all", argsIgnorePattern = "^_", varsIgnorePattern = "^_", caughtErrorsIgnorePattern = "^_" }]
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-shadow" = "error"
"@typescript-eslint/ban-ts-comment" = "error"
"@typescript-eslint/no-unsafe-declaration-merging" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/consistent-type-imports" = ["error", { disallowTypeAnnotations = false }]
"@typescript-eslint/no-useless-constructor" = "error"
"@typescript-eslint/no-floating-promises" = "error"
"@typescript-eslint/await-thenable" = "error"
"@typescript-eslint/explicit-function-return-type" = "warn"
"class-methods-use-this" = "error"
"react-hooks/rules-of-hooks" = "error"
"react-hooks/exhaustive-deps" = "warn"
"react/no-children-prop" = "error"

"unicorn/filename-case" = "error"
"unicorn/no-array-for-each" = "warn"
"jsx-a11y/alt-text" = "error"
"jsx-a11y/anchor-has-content" = "error"
"jsx-a11y/aria-props" = "error"
"jsx-a11y/aria-proptypes" = "error"
"jsx-a11y/aria-role" = "error"
"jsx-a11y/aria-unsupported-elements" = "error"
"jsx-a11y/heading-has-content" = "error"
"jsx-a11y/html-has-lang" = "error"
"jsx-a11y/iframe-has-title" = "error"
"jsx-a11y/no-access-key" = "error"
"jsx-a11y/no-autofocus" = "error"
"jsx-a11y/no-distracting-elements" = "error"
"jsx-a11y/no-redundant-roles" = "error"
"jsx-a11y/role-has-required-aria-props" = "error"
"jsx-a11y/role-supports-aria-props" = "error"
"jsx-a11y/scope" = "error"
"jsx-a11y/tabindex-no-positive" = "error"

[[lint.overrides]]
files = ["**/*.ts", "**/*.tsx"]
rules = { "import/no-default-export" = "error" }

[[lint.overrides]]
files = ["e2e/**/*.ts", "playwright.config.ts", "playwright.ssr.config.ts", "prisma.config.ts"]
rules = { "import/no-default-export" = "off" }

[[lint.overrides]]
files = ["frontend/components/note-form.tsx", "frontend/components/auth-form.tsx"]
rules = { "react/no-children-prop" = "off" }

[[lint.overrides]]
files = ["scripts/**", "backend/server.ts", "backend/ssr/**", "**/__tests__/**"]
rules = { "no-console" = "off" }

[fmt]
useTabs = true
semi = false
singleQuote = true
trailingComma = "all"
sortImports = true
sortTailwindcss = true
# Keep the formatting gate focused on the source/config formats Biome covered.
ignorePatterns = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.toml"]
