name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx prisma generate
      - run: DATABASE_URL=file:./ci.db bunx prisma migrate reset --force --skip-generate
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: 'true'
          BETTER_AUTH_SECRET: ci-test
          BETTER_AUTH_URL: http://localhost:3000
